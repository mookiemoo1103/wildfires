name: Update Active Wildfire Placefile

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-wildfires:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate active wildfire placefile
        run: python3 generate_wildfire_placefile.py

      - name: Commit updated placefile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add active_wildfires.txt
          if git diff --cached --quiet; then
            echo "No placefile changes to commit."
          else
            git commit -m "Update active wildfire placefile"
            git push
          fi
