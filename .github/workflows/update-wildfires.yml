name: Update Active Wildfire Placefile

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: active-wildfire-placefile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate placefile
        run: python generate_wildfire_placefile.py

      - name: Commit updated placefile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add active_wildfires.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update active wildfire placefile"
            git push
          fi
